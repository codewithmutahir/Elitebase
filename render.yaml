# Elitebase — Render Blueprint (face recognition API)
# Deploy: Render Dashboard → New → Blueprint → connect this repo
# Or create the web service manually with runtime: Docker, root dir: face-service

services:
  - type: web
    name: elitebase-face-service
    runtime: docker
    region: singapore
    plan: free
    rootDir: face-service
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: INTERNAL_API_KEY
        sync: false
      - key: USE_GUNICORN
        value: "0"
      - key: GUNICORN_WORKERS
        value: "1"
      - key: INSIGHTFACE_MODEL
        value: "buffalo_sc"
      - key: INSIGHTFACE_DET_SIZE
        value: "320"
      - key: FACE_VERIFY_THRESHOLD
        value: "0.45"
